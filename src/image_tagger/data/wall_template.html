<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ wall_title }}</title>
    <style>
        :root {
            --cell-width: {{ cell_width }}px;
            --cell-height: {{ cell_height }}px;
            color-scheme: light dark;
            font-family: Georgia, 'Times New Roman', serif;
            background: #111;
        }
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: #111;
        }
        body { overflow-x: hidden; }
        .hud-toggle {
            position: fixed;
            top: 0.75rem;
            right: 0.75rem;
            z-index: 20;
            display: none;
            place-items: center;
            width: 2rem;
            height: 2rem;
            padding: 0;
            border: 1px solid rgb(255 255 255 / 28%);
            border-radius: 0.2rem;
            background: #111;
            color: #fff;
            font: 1rem/1 Georgia, 'Times New Roman', serif;
            cursor: pointer;
        }
        .hud-toggle:hover { background: #242424; }
        .hud-toggle:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }
        @media (max-width: 48rem), (pointer: coarse) {
            .hud-toggle { display: grid; }
            .hud-toggle[aria-expanded="true"] { display: none; }
        }
        .search-panel {
            position: fixed;
            top: 0.75rem;
            right: 0.75rem;
            z-index: 20;
            display: none;
            width: min(22rem, calc(100vw - 1.5rem));
        }
        .search-panel.is-open { display: block; }
        .search-row { position: relative; }
        .search-panel input[type="search"] {
            display: block;
            width: 100%;
            height: 2rem;
            padding: 0 2.25rem 0 0.6rem;
            border: 1px solid rgb(255 255 255 / 28%);
            border-radius: 0.2rem;
            background: #111;
            color: #fff;
            font: 1rem/1.2 Georgia, 'Times New Roman', serif;
        }
        .search-panel input[type="search"]:focus {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }
        .search-close {
            position: absolute;
            top: 50%;
            right: 0.5rem;
            width: 1rem;
            height: 1rem;
            padding: 0;
            border: 1px solid rgb(255 255 255 / 55%);
            border-radius: 50%;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transform: translateY(-50%);
        }
        .search-close::before,
        .search-close::after {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0.5rem;
            height: 1px;
            background: currentColor;
            content: '';
        }
        .search-close::before { transform: translate(-50%, -50%) rotate(45deg); }
        .search-close::after { transform: translate(-50%, -50%) rotate(-45deg); }
        .search-close:hover { background: rgb(255 255 255 / 16%); }
        .search-close:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }
        .search-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.35rem;
            margin-top: 0.35rem;
        }
        .zoom-control {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            min-width: 0;
            height: 2rem;
            padding: 0 0.45rem;
            border: 1px solid rgb(255 255 255 / 28%);
            border-radius: 0.2rem;
            background: #111;
            color: #fff;
        }
        .zoom-control input[type="range"] {
            flex: 1;
            min-width: 0;
            accent-color: #fff;
            cursor: pointer;
            direction: rtl;
        }
        .order-button {
            position: relative;
            display: grid;
            place-items: center;
            width: 2rem;
            height: 2rem;
            padding: 0;
            border: 1px solid rgb(255 255 255 / 28%);
            border-radius: 0.2rem;
            background: #111;
            color: #fff;
            font: 1rem/1 Georgia, 'Times New Roman', serif;
            cursor: pointer;
        }
        .order-button:hover { background: #242424; }
        .order-button[aria-pressed="true"] {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }
        .order-button.is-busy { color: transparent; }
        .order-button.is-busy::after {
            position: absolute;
            color: #fff;
            content: '…';
        }
        .order-button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }
        .wall {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--cell-width), 1fr));
            grid-auto-rows: var(--cell-height);
            gap: 0;
            width: 100vw;
            min-height: 100vh;
            align-content: start;
            background: #111;
        }
        .tile {
            display: block;
            width: 100%;
            height: 100%;
            padding: 0;
            border: 0;
            background: #111;
            cursor: zoom-in;
            overflow: hidden;
        }
        .tile.double-wide {
            grid-column: span 2;
        }
        .wall.single-column {
            grid-auto-rows: calc(var(--cell-height) / 2);
        }
        .wall.single-column .tile {
            grid-row: span 2;
        }
        .wall.single-column .tile.double-wide {
            grid-column: span 1;
            grid-row: span 1;
        }
        .tile.is-hidden { display: none; }
        .tile img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            place-items: center;
            padding: 1vmin;
            background: rgb(0 0 0 / 92%);
            cursor: zoom-out;
        }
        .lightbox.is-open { display: grid; }
        .lightbox img {
            display: block;
            max-width: 100vw;
            max-height: calc(100vh - 2vmin);
            object-fit: contain;
            box-shadow: 0 1rem 4rem rgb(0 0 0 / 55%);
        }
        .lightbox-info {
            position: absolute;
            right: 0.75rem;
            bottom: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.35rem;
            cursor: default;
        }
        .lightbox-info-text {
            width: max(10vw, min(500px, calc(100vw - 1.5rem)));
            max-width: calc(100vw - 1.5rem);
            max-height: calc(100vh - 4.5rem);
            margin: 0;
            padding: 0.6rem;
            overflow: auto;
            border: 1px solid rgb(255 255 255 / 28%);
            border-radius: 0.2rem;
            background: #111;
            color: #fff;
            font: 0.85rem/1.35 ui-monospace, Consolas, monospace;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
        .lightbox-info-text[hidden] { display: none; }
        .lightbox-info-button {
            font-style: normal;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <button class="hud-toggle" type="button" aria-label="Open wall controls" aria-controls="wall-controls" aria-expanded="false" title="Wall controls">☰</button>
    <form class="search-panel" id="wall-controls" role="search" aria-label="Search image wall">
        <div class="search-row">
            <input type="search" aria-label="Search filenames and titles" autocomplete="off" spellcheck="false">
            <button class="search-close" type="button" aria-label="Clear and close search"></button>
        </div>
        <div class="search-controls" aria-label="Wall controls">
            <label class="zoom-control" title="Cell size">
                <span aria-hidden="true">−</span>
                <input type="range" min="0" max="59" step="1" value="0" aria-label="Wall columns">
                <span aria-hidden="true">+</span>
            </label>
            <button class="order-button" type="button" data-order="name" aria-label="Sort by filename" title="Sort by filename">Ⓐ</button>
            <button class="order-button" type="button" data-order="date" aria-label="Sort chronologically" title="Sort chronologically">◷</button>
            <button class="order-button" type="button" data-order="random" aria-label="Randomize order" title="Randomize order">⤨</button>
            {% if show_grid_control %}<button class="order-button" type="button" data-order="grid" aria-label="Arrange similarity grid" title="Arrange similarity grid">▦</button>{% endif %}
        </div>
    </form>
    <main class="wall" aria-label="Image wall">
        {% for item in items %}
            <button class="tile{% if item.is_double_wide %} double-wide{% endif %}" type="button">
                <img src="{{ item.src }}" alt="{{ item.alt }}" title="{{ item.title }}" loading="lazy" data-filename="{{ item.alt }}" data-mtime-ns="{{ item.mtime_ns }}" data-similarity-index="{% if item.similarity_index is not none %}{{ item.similarity_index }}{% endif %}">
            </button>
        {% endfor %}
    </main>
    <div class="lightbox" role="dialog" aria-modal="true" aria-label="Full-size image">
        <img alt="">
        <div class="lightbox-info">
            <pre class="lightbox-info-text" hidden></pre>
            <button class="lightbox-info-button order-button" type="button" aria-label="Toggle image information" aria-expanded="false" title="Image information">i</button>
        </div>
    </div>
    <script>
        window.wallSimilarity = {{ similarity_matrix | tojson }};
        window.wallZoomLevels = {{ zoom_levels | tojson }};

        const hudToggleButton = document.querySelector('.hud-toggle');
        const searchPanel = document.querySelector('.search-panel');
        const searchInput = searchPanel.querySelector('input');
        const searchCloseButton = searchPanel.querySelector('.search-close');
        const zoomInput = searchPanel.querySelector('.zoom-control input');
        const orderButtons = Array.from(searchPanel.querySelectorAll('.order-button'));
        const wall = document.querySelector('.wall');
        const lightbox = document.querySelector('.lightbox');
        const lightboxImage = lightbox.querySelector('img');
        const lightboxInfoButton = lightbox.querySelector('.lightbox-info-button');
        const lightboxInfoText = lightbox.querySelector('.lightbox-info-text');
        const tiles = Array.from(document.querySelectorAll('.tile'));
        const tileMetadata = (tile) => tile.querySelector('img').dataset;
        const tileIndices = new Map(tiles.map((tile, index) => [tile, index]));
        const gridButton = searchPanel.querySelector('[data-order="grid"]');
        let orderedTiles = [...tiles];
        let activeTile = null;
        let gridWorker = null;
        let gridCache = null;
        let pendingGrid = null;
        let gridRequestId = 0;
        let gridVersion = 0;
        let resizeFrame = 0;
        const initialCellWidth = {{ cell_width }};
        const initialCellHeight = {{ cell_height }};
        const maximumColumnCount = 60;
        const zoomLevels = window.wallZoomLevels.length > 0
            ? window.wallZoomLevels
            : Array.from({ length: maximumColumnCount }, (unused, index) => index + 1);
        const startsInSingleColumn = window.matchMedia(
            '(max-width: 48rem) and (orientation: portrait)',
        ).matches;

        const ASCII_EQUIVALENTS = {
            'ß': 'ss',
            'æ': 'ae',
            'œ': 'oe',
            'ð': 'd',
            'þ': 'th',
            'ø': 'o',
            'ł': 'l',
            'đ': 'd',
            'ħ': 'h',
            'ı': 'i',
            'ŋ': 'n',
            '—': '-',
            '–': '-',
            '―': '-',
            '‐': '-',
            '‑': '-',
            '‒': '-',
            '“': '"',
            '”': '"',
            '„': '"',
            '«': '"',
            '»': '"',
            '‘': "'",
            '’': "'",
            '‚': "'",
            '‹': "'",
            '›': "'",
            '…': '...',
            '·': '.',
            '•': '*',
            '©': '(c)',
            '®': '(r)',
            '™': 'tm',
        };

        const normalizeSearchText = (value) => value
            .toLowerCase()
            .replace(/[ßæœðþøłđħıŋ—–―‐‑‒“”„«»‘’‚‹›…·•©®™]/g, (character) => ASCII_EQUIVALENTS[character])
            .normalize('NFKD')
            .replace(/[\u0300-\u036f]/g, '');

        const filterTiles = () => {
            const terms = normalizeSearchText(searchInput.value)
                .trim()
                .split(/\s+/)
                .filter(Boolean);

            tiles.forEach((tile) => {
                const image = tile.querySelector('img');
                const searchText = normalizeSearchText(`${image.alt}\n${image.title}`);
                tile.classList.toggle(
                    'is-hidden',
                    terms.length > 0 && !terms.every((term) => searchText.includes(term)),
                );
            });
            arrangeTiles();
        };

        const getColumnCount = () => getComputedStyle(wall)
            .gridTemplateColumns
            .split(' ')
            .filter(Boolean)
            .length;

        const arrangeTiles = () => {
            orderedTiles.forEach((tile) => wall.append(tile));
            const columnCount = getColumnCount();
            if (columnCount < 2) {
                return;
            }

            const visibleTiles = orderedTiles.filter((tile) => !tile.classList.contains('is-hidden'));
            const arrangedTiles = [...visibleTiles];
            let realIndex = 0;
            arrangedTiles.forEach((tile, index) => {
                const isDoubleWide = tile.classList.contains('double-wide');
                realIndex += isDoubleWide ? 2 : 1;

                if (realIndex % columnCount === 1 && isDoubleWide) {
                    for (let otherIndex = index - 1; otherIndex >= Math.max(0, index - 5); otherIndex -= 1) {
                        const otherTile = arrangedTiles[otherIndex];
                        if (!otherTile.classList.contains('double-wide')) {
                            arrangedTiles[index] = otherTile;
                            arrangedTiles[otherIndex] = tile;
                            break;
                        }
                    }
                }
            });

            arrangedTiles.forEach((tile) => wall.append(tile));
            orderedTiles
                .filter((tile) => tile.classList.contains('is-hidden'))
                .forEach((tile) => wall.append(tile));
        };

        const calculateGridOrder = (similarity, sourceItems, columnCount) => {
            const dot = (left, right) => left.reduce(
                (total, value, index) => total + value * right[index],
                0,
            );
            const orthogonalize = (vector, basis) => {
                const result = [...vector];
                basis.forEach((axis) => {
                    const projection = dot(result, axis);
                    result.forEach((unused, index) => {
                        result[index] -= projection * axis[index];
                    });
                });
                const norm = Math.hypot(...result);
                return norm > 1e-10 ? result.map((value) => value / norm) : null;
            };
            const spectralAxis = (matrix, seed, basis) => {
                let axis = orthogonalize(
                    matrix.map((unused, index) => Math.sin((index + 1) * seed)),
                    basis,
                );
                if (!axis) {
                    return matrix.map(
                        (unused, index) => index / Math.max(1, matrix.length - 1),
                    );
                }
                for (let iteration = 0; iteration < 60; iteration += 1) {
                    const multiplied = matrix.map((row) => dot(row, axis));
                    const nextAxis = orthogonalize(multiplied, basis);
                    if (!nextAxis) {
                        break;
                    }
                    axis = nextAxis;
                }
                return axis;
            };
            const scaleAxis = (values, extent) => {
                const minimum = Math.min(...values);
                const maximum = Math.max(...values);
                if (maximum - minimum < 1e-10) {
                    return values.map(() => extent / 2);
                }
                return values.map(
                    (value) => (value - minimum) / (maximum - minimum) * extent,
                );
            };
            const hungarianAssignment = (costs) => {
                const rowCount = costs.length;
                const cellCount = costs[0].length;
                const rowPotentials = Array(rowCount + 1).fill(0);
                const cellPotentials = Array(cellCount + 1).fill(0);
                const matchedRow = Array(cellCount + 1).fill(0);
                const previousCell = Array(cellCount + 1).fill(0);

                for (let row = 1; row <= rowCount; row += 1) {
                    matchedRow[0] = row;
                    let cell = 0;
                    const minimums = Array(cellCount + 1).fill(Infinity);
                    const used = Array(cellCount + 1).fill(false);
                    do {
                        used[cell] = true;
                        const currentRow = matchedRow[cell];
                        let delta = Infinity;
                        let nextCell = 0;
                        for (let candidate = 1; candidate <= cellCount; candidate += 1) {
                            if (used[candidate]) {
                                continue;
                            }
                            const cost = costs[currentRow - 1][candidate - 1]
                                - rowPotentials[currentRow]
                                - cellPotentials[candidate];
                            if (cost < minimums[candidate]) {
                                minimums[candidate] = cost;
                                previousCell[candidate] = cell;
                            }
                            if (minimums[candidate] < delta) {
                                delta = minimums[candidate];
                                nextCell = candidate;
                            }
                        }
                        for (let candidate = 0; candidate <= cellCount; candidate += 1) {
                            if (used[candidate]) {
                                rowPotentials[matchedRow[candidate]] += delta;
                                cellPotentials[candidate] -= delta;
                            } else {
                                minimums[candidate] -= delta;
                            }
                        }
                        cell = nextCell;
                    } while (matchedRow[cell] !== 0);

                    do {
                        const priorCell = previousCell[cell];
                        matchedRow[cell] = matchedRow[priorCell];
                        cell = priorCell;
                    } while (cell !== 0);
                }

                const assignment = Array(rowCount).fill(0);
                for (let cell = 1; cell <= cellCount; cell += 1) {
                    if (matchedRow[cell] > 0) {
                        assignment[matchedRow[cell] - 1] = cell - 1;
                    }
                }
                return assignment;
            };

            const indexedItems = sourceItems.filter(
                (item) => item.similarityIndex !== null,
            );
            if (indexedItems.length < 2) {
                return sourceItems.map((item) => item.sourceIndex);
            }
            const expandedItems = indexedItems.flatMap(
                (item) => item.isDoubleWide ? [item, item] : [item],
            );
            const matrix = expandedItems.map((left) => expandedItems.map(
                (right) => similarity[left.similarityIndex][right.similarityIndex],
            ));
            const constantAxis = matrix.map(() => 1 / Math.sqrt(matrix.length));
            const xAxis = spectralAxis(matrix, 1.7, [constantAxis]);
            const yAxis = spectralAxis(matrix, 2.9, [constantAxis, xAxis]);
            const rowCount = Math.ceil(expandedItems.length / columnCount);
            const xCoordinates = scaleAxis(xAxis, columnCount - 1);
            const yCoordinates = scaleAxis(yAxis, rowCount - 1);
            const costs = matrix.map((unused, imageIndex) => Array.from(
                { length: rowCount * columnCount },
                (unusedCell, cellIndex) => {
                    const xDistance = xCoordinates[imageIndex] - cellIndex % columnCount;
                    const yDistance = yCoordinates[imageIndex]
                        - Math.floor(cellIndex / columnCount);
                    return xDistance * xDistance + yDistance * yDistance;
                },
            ));
            const assignments = hungarianAssignment(costs);
            const assignedCells = new Map();
            expandedItems.forEach((item, index) => {
                assignedCells.set(
                    item.sourceIndex,
                    Math.min(
                        assignments[index],
                        assignedCells.get(item.sourceIndex) ?? Infinity,
                    ),
                );
            });
            const optimizedItems = [...indexedItems].sort(
                (left, right) => assignedCells.get(left.sourceIndex)
                    - assignedCells.get(right.sourceIndex),
            );
            const indexedSources = new Set(
                indexedItems.map((item) => item.sourceIndex),
            );
            return [
                ...optimizedItems.map((item) => item.sourceIndex),
                ...sourceItems
                    .filter((item) => !indexedSources.has(item.sourceIndex))
                    .map((item) => item.sourceIndex),
            ];
        };

        const createGridWorker = () => {
            if (!window.Worker) {
                return null;
            }
            const workerSource = `
                const calculateGridOrder = ${calculateGridOrder.toString()};
                let similarity = [];
                self.addEventListener('message', (event) => {
                    if (event.data.type === 'initialize') {
                        similarity = event.data.similarity;
                        return;
                    }
                    const sourceOrder = calculateGridOrder(
                        similarity,
                        event.data.sourceItems,
                        event.data.columnCount,
                    );
                    self.postMessage({ requestId: event.data.requestId, sourceOrder });
                });
            `;
            const workerUrl = URL.createObjectURL(
                new Blob([workerSource], { type: 'text/javascript' }),
            );
            const worker = new Worker(workerUrl);
            URL.revokeObjectURL(workerUrl);
            worker.postMessage({ type: 'initialize', similarity: window.wallSimilarity });
            worker.addEventListener('message', completeGridCalculation);
            return worker;
        };

        const setGridBusy = (isBusy) => {
            if (!gridButton) {
                return;
            }
            gridButton.classList.toggle('is-busy', isBusy);
            gridButton.setAttribute('aria-busy', String(isBusy));
        };

        const gridSourceKey = (sourceTiles, columnCount) => `${columnCount}:${
            sourceTiles
                .map((tile) => tileIndices.get(tile))
                .sort((left, right) => left - right)
                .join(',')
        }`;

        const gridSourceItems = (sourceTiles) => sourceTiles.map((tile, sourceIndex) => {
            const rawSimilarityIndex = tileMetadata(tile).similarityIndex;
            return {
                sourceIndex,
                similarityIndex: rawSimilarityIndex === ''
                    ? null
                    : Number(rawSimilarityIndex),
                isDoubleWide: tile.classList.contains('double-wide'),
            };
        });

        const applyGridOrder = (sourceTiles, gridOrder) => {
            const gridSet = new Set(sourceTiles);
            orderedTiles = [
                ...gridOrder,
                ...orderedTiles.filter((tile) => !gridSet.has(tile)),
            ];
            arrangeTiles();
        };

        function completeGridCalculation(event) {
            if (
                !pendingGrid
                || event.data.requestId !== pendingGrid.requestId
                || pendingGrid.version !== gridVersion
            ) {
                return;
            }
            const completedRequest = pendingGrid;
            const gridOrder = event.data.sourceOrder.map(
                (sourceIndex) => completedRequest.sourceTiles[sourceIndex],
            );
            gridCache = { key: completedRequest.key, gridOrder };
            pendingGrid = null;
            setGridBusy(false);
            if (completedRequest.isExplicit) {
                applyGridOrder(completedRequest.sourceTiles, gridOrder);
            }
        }

        const requestGridCalculation = (sourceTiles, isExplicit) => {
            const columnCount = getColumnCount();
            const key = gridSourceKey(sourceTiles, columnCount);
            if (gridCache?.key === key) {
                if (isExplicit) {
                    applyGridOrder(sourceTiles, gridCache.gridOrder);
                }
                return;
            }
            if (pendingGrid?.key === key) {
                pendingGrid.isExplicit ||= isExplicit;
                setGridBusy(pendingGrid.isExplicit);
                return;
            }
            if (pendingGrid) {
                gridWorker?.terminate();
                gridWorker = null;
                pendingGrid = null;
            }

            const requestId = ++gridRequestId;
            pendingGrid = {
                requestId,
                key,
                version: gridVersion,
                sourceTiles,
                isExplicit,
            };
            setGridBusy(isExplicit);
            const sourceItems = gridSourceItems(sourceTiles);
            gridWorker ||= createGridWorker();
            if (gridWorker) {
                gridWorker.postMessage({
                    type: 'calculate',
                    requestId,
                    sourceItems,
                    columnCount,
                });
                return;
            }
            setTimeout(() => {
                completeGridCalculation({
                    data: {
                        requestId,
                        sourceOrder: calculateGridOrder(
                            window.wallSimilarity,
                            sourceItems,
                            columnCount,
                        ),
                    },
                });
            }, 0);
        };

        const invalidateGridCalculation = () => {
            gridVersion += 1;
            gridCache = null;
            pendingGrid = null;
            setGridBusy(false);
            gridWorker?.terminate();
            gridWorker = null;
        };

        const setActiveOrder = (order) => {
            orderButtons.forEach((button) => {
                button.setAttribute('aria-pressed', String(button.dataset.order === order));
            });
        };

        const orderTiles = (order) => {
            if (pendingGrid) {
                pendingGrid.isExplicit = false;
            }
            setGridBusy(false);
            if (order === 'name') {
                orderedTiles.sort((left, right) => tileMetadata(left).filename
                    .toLowerCase()
                    .localeCompare(tileMetadata(right).filename.toLowerCase()));
            } else if (order === 'date') {
                orderedTiles.sort(
                    (left, right) => Number(
                        BigInt(tileMetadata(right).mtimeNs)
                        - BigInt(tileMetadata(left).mtimeNs),
                    ),
                );
            } else if (order === 'random') {
                for (let index = orderedTiles.length - 1; index > 0; index -= 1) {
                    const otherIndex = Math.floor(Math.random() * (index + 1));
                    [orderedTiles[index], orderedTiles[otherIndex]] = [
                        orderedTiles[otherIndex],
                        orderedTiles[index],
                    ];
                }
            } else if (order === 'grid') {
                setActiveOrder(order);
                requestGridCalculation(
                    orderedTiles.filter((tile) => !tile.classList.contains('is-hidden')),
                    true,
                );
                return;
            }
            arrangeTiles();
            setActiveOrder(order);
        };

        const arrangeTilesOnResize = () => {
            invalidateGridCalculation();
            cancelAnimationFrame(resizeFrame);
            resizeFrame = requestAnimationFrame(() => {
                arrangeTiles();
                syncZoomInput();
            });
        };

        const setCellWidth = (requestedWidth) => {
            const cellWidth = Math.max(1, Number(requestedWidth));
            const cellHeight = Math.round(
                cellWidth * initialCellHeight / initialCellWidth,
            );
            document.documentElement.style.setProperty('--cell-width', `${cellWidth}px`);
            document.documentElement.style.setProperty('--cell-height', `${cellHeight}px`);
            arrangeTilesOnResize();
        };

        const nearestZoomLevelIndex = (columnCount) => zoomLevels.reduce(
            (nearestIndex, level, index) => (
                Math.abs(level - columnCount) < Math.abs(zoomLevels[nearestIndex] - columnCount)
                    ? index
                    : nearestIndex
            ),
            0,
        );

        const formatColumnCount = (columnCount) => columnCount === 1
            ? '1 column'
            : `${columnCount} columns`;

        const syncZoomInput = () => {
            const columnCount = getColumnCount();
            wall.classList.toggle('single-column', columnCount === 1);
            zoomInput.min = '0';
            zoomInput.max = String(zoomLevels.length - 1);
            zoomInput.value = String(nearestZoomLevelIndex(columnCount));
            zoomInput.setAttribute('aria-valuetext', formatColumnCount(columnCount));
        };

        const setColumnCount = (requestedCount) => {
            const requestedLevel = Math.max(
                1,
                Math.min(maximumColumnCount, Math.round(Number(requestedCount))),
            );
            const columnCount = zoomLevels[nearestZoomLevelIndex(requestedLevel)];
            const cellWidth = (wall.clientWidth - 0.5) / columnCount;
            wall.classList.toggle('single-column', columnCount === 1);
            setCellWidth(cellWidth);
            zoomInput.value = String(zoomLevels.indexOf(columnCount));
            zoomInput.setAttribute('aria-valuetext', formatColumnCount(columnCount));
        };

        const zoomByColumns = (direction) => {
            const currentColumnCount = getColumnCount();
            const nextLevel = direction > 0
                ? [...zoomLevels].reverse().find((level) => level < currentColumnCount)
                : zoomLevels.find((level) => level > currentColumnCount);
            if (nextLevel !== undefined) {
                setColumnCount(nextLevel);
            }
        };

        const resetZoom = () => {
            wall.classList.remove('single-column');
            setCellWidth(initialCellWidth);
        };

        const openSearch = (focusSearch = true) => {
            searchPanel.classList.add('is-open');
            hudToggleButton.setAttribute('aria-expanded', 'true');
            if (focusSearch) {
                searchInput.focus();
                searchInput.select();
            }
        };

        const closeSearch = () => {
            searchInput.value = '';
            filterTiles();
            searchPanel.classList.remove('is-open');
            searchInput.blur();
            hudToggleButton.setAttribute('aria-expanded', 'false');
        };

        const openLightbox = (tile) => {
            const image = tile.querySelector('img');
            activeTile = tile;
            lightboxImage.src = image.currentSrc || image.src;
            lightboxImage.alt = image.alt;
            lightboxInfoText.textContent = image.title;
            lightbox.classList.add('is-open');
        };

        const setLightboxInfoOpen = (isOpen) => {
            lightboxInfoText.hidden = !isOpen;
            lightboxInfoButton.setAttribute('aria-expanded', String(isOpen));
        };

        const toggleLightboxInfo = () => {
            setLightboxInfoOpen(lightboxInfoText.hidden);
        };

        const closeLightbox = () => {
            lightbox.classList.remove('is-open');
            lightboxImage.removeAttribute('src');
            lightboxInfoText.textContent = '';
            setLightboxInfoOpen(false);
            activeTile = null;
        };

        const moveLightbox = (direction) => {
            const visibleTiles = Array.from(wall.querySelectorAll('.tile:not(.is-hidden)'));
            const currentIndex = visibleTiles.indexOf(activeTile);
            const nextIndex = (currentIndex + direction + visibleTiles.length) % visibleTiles.length;

            if (visibleTiles.length > 0) {
                openLightbox(visibleTiles[nextIndex]);
            }
        };

        searchPanel.addEventListener('submit', (event) => {
            event.preventDefault();
        });

        searchInput.addEventListener('input', filterTiles);

        hudToggleButton.addEventListener('click', () => openSearch(false));

        zoomInput.addEventListener('input', () => {
            setColumnCount(zoomLevels[Number(zoomInput.value)]);
        });

        searchCloseButton.addEventListener('click', closeSearch);

        orderButtons.forEach((button) => {
            button.addEventListener('click', () => orderTiles(button.dataset.order));
        });

        document.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            const hasZoomModifier = event.ctrlKey || event.metaKey;
            const isZoomShortcut = hasZoomModifier
                && ['+', '=', '-', '_', '0'].includes(event.key);
            if (isZoomShortcut) {
                event.preventDefault();
                if (event.key === '0') {
                    resetZoom();
                } else {
                    const direction = ['+', '='].includes(event.key) ? 1 : -1;
                    zoomByColumns(direction);
                }
                return;
            }
            if (lightbox.classList.contains('is-open')) {
                if (event.key === 'Escape') {
                    closeLightbox();
                    return;
                }
                if (event.key === 'ArrowLeft') {
                    moveLightbox(-1);
                    return;
                }
                if (event.key === 'ArrowRight') {
                    moveLightbox(1);
                    return;
                }
                if (key === 'i') {
                    toggleLightboxInfo();
                }
                return;
            }
            if (event.key === 'Escape') {
                if (searchPanel.classList.contains('is-open')) {
                    closeSearch();
                } else {
                    openSearch();
                }
                return;
            }
            const isTyping = event.target instanceof HTMLInputElement
                || event.target instanceof HTMLTextAreaElement;
            if (key === 'f' && (!isTyping || event.ctrlKey || event.metaKey)) {
                event.preventDefault();
                openSearch();
                return;
            }
            if (isTyping || event.ctrlKey || event.metaKey || event.altKey) {
                return;
            }
            const shortcutOrders = {
                n: 'name',
                d: 'date',
                r: 'random',
                g: 'grid',
            };
            const order = shortcutOrders[key];
            if (order && (order !== 'grid' || gridButton)) {
                orderTiles(order);
            }
        });

        window.addEventListener('wheel', (event) => {
            if (!event.ctrlKey && !event.metaKey) {
                return;
            }
            event.preventDefault();
            const direction = event.deltaY < 0 ? 1 : -1;
            zoomByColumns(direction);
        }, { passive: false });

        window.addEventListener('resize', arrangeTilesOnResize);

        arrangeTiles();
        if (startsInSingleColumn) {
            setColumnCount(1);
        } else {
            syncZoomInput();
        }
        if (gridButton) {
            requestGridCalculation([...tiles], false);
        }

        document.querySelectorAll('.tile img').forEach((image) => {
            image.addEventListener('click', () => {
                openLightbox(image.closest('.tile'));
            });
        });

        lightboxInfoButton.addEventListener('click', () => {
            toggleLightboxInfo();
        });

        lightbox.addEventListener('click', (event) => {
            if (!event.target.closest('.lightbox-info')) {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
