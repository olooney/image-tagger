<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Metadata Review</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        .save-status { min-height: 1.5rem; color: #2f6f3e; }
        .filename-mismatch {
            padding: 0.125rem 0.25rem;
            background-color: #ffeb00;
            color: #1a1a1a;
        }
        .btn-primary:disabled {
            border-color: #999;
            background-color: #bbb;
            color: #555;
            opacity: 1;
        }
        textarea.description-field { min-height: 15rem; }
        textarea.tags-field { min-height: 4rem; }
        .image-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
        .image-heading > span:first-child { min-width: 0; overflow-wrap: anywhere; }
        .image-dimensions { flex: none; font-weight: normal; }
        .crop-trigger { cursor: pointer; }
        .review-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-start;
            gap: 0.5rem;
        }
        .shelve-report {
            padding: 1rem;
            border: 1px solid #ccc;
            background-color: #f8f9fa;
            white-space: pre-wrap;
        }
        body.crop-open { overflow: hidden; }
        .crop-modal {
            position: fixed;
            z-index: 1050;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2vh 2vw;
            background: rgba(0, 0, 0, 0.78);
        }
        .crop-modal[hidden] { display: none; }
        .crop-dialog {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 96vw;
            height: 96vh;
            border: 1px solid #555;
            background: #181818;
            color: #fff;
            box-shadow: 0 1rem 4rem rgba(0, 0, 0, 0.65);
        }
        .crop-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 3.25rem;
            padding: 0.5rem 0.75rem 0.5rem 1rem;
            border-bottom: 1px solid #444;
        }
        .crop-header h2 { min-width: 0; margin: 0; overflow-wrap: anywhere; font-size: 1.1rem; }
        .crop-header-actions { display: flex; align-items: center; gap: 0.5rem; }
        .crop-canvas-background {
            width: 2.25rem;
            height: 2.25rem;
            padding: 0.4rem;
            border: 1px solid #777;
            background: transparent;
            cursor: pointer;
        }
        .crop-background-swatch {
            display: block;
            width: 100%;
            height: 100%;
            border: 1px solid #fff;
            background: #808080;
        }
        .crop-mode-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
        .crop-close {
            width: 2.25rem;
            height: 2.25rem;
            border: 0;
            background: transparent;
            color: #fff;
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
        }
        .crop-workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            flex: 1;
            min-height: 0;
            background: #808080;
        }
        .crop-pane {
            position: relative;
            display: flex;
            min-width: 0;
            min-height: 0;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: inherit;
        }
        .crop-pane + .crop-pane { border-left: 1px solid #444; }
        .crop-pane canvas { display: block; max-width: 100%; max-height: 100%; }
        #crop-source-canvas { width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
        #crop-preview-canvas { object-fit: contain; }
        .crop-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
        }
        .crop-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
            min-height: 3.5rem;
            padding: 0.5rem 1rem;
            border-top: 1px solid #444;
        }
        .crop-footer label { display: flex; align-items: center; gap: 0.5rem; margin: 0; }
        .crop-footer input[type="color"] { width: 3rem; height: 2rem; padding: 0; border: 0; }
        #crop-source-canvas.eyedrop-active { cursor: copy; }
        .crop-detectors { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
        .rectangle-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
        .rectangle-tools[hidden], .crop-detectors[hidden] { display: none; }
        .rectangle-tools input[type="number"] { width: 5.5rem; }
        .rectangle-tools select { width: auto; }
        .crop-actions { display: flex; align-items: center; gap: 1rem; margin-left: auto; }
        .crop-error { color: #ff8f8f; }
        @media (max-width: 800px) {
            .crop-workspace { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
            .crop-pane + .crop-pane { border-top: 1px solid #444; border-left: 0; }
            .crop-footer { gap: 0.5rem; }
            .rectangle-tools, .crop-detectors { width: 100%; }
        }
    </style>
    <script>
{% include "review.js" %}
    </script>
</head>
<body>
    <header class="py-3" style="background-color: #800000; font-family: Garamond, 'Times New Roman', serif;">
        <div class="container">
            <h1 class="text-left">
                <a href="/" style="color: white; text-decoration: none;">
                    Image Metadata Review
                </a>
            </h1>
        </div>
    </header>

    <div class="container mt-3">
        <p id="empty-review-message" class="alert alert-info" role="status"{% if items %} hidden{% endif %}>
            No images to review.
        </p>
        <div id="shelve-controls" class="mb-4 d-flex align-items-start"{% if items %} hidden{% endif %}>
            <button type="button" class="btn btn-primary" hx-post="/shelve" hx-target="#shelve-output" hx-swap="innerHTML">
                Shelve All
            </button>
        </div>
        <div id="shelve-output" class="mb-4"></div>
    </div>

    <div id="review-list" class="container">
        {{ review_list | safe }}
    </div>

    <div id="crop-modal" class="crop-modal" role="dialog" aria-modal="true" aria-labelledby="crop-title" hidden>
        <div class="crop-dialog">
            <div class="crop-header">
                <h2 id="crop-title">Crop Tool</h2>
                <div class="crop-header-actions">
                    <button id="crop-canvas-background" class="crop-canvas-background" type="button" aria-label="Canvas background: gray" title="Canvas background: gray">
                        <span id="crop-background-swatch" class="crop-background-swatch" aria-hidden="true"></span>
                    </button>
                    <button id="crop-close" class="crop-close" type="button" aria-label="Close" title="Close">&times;</button>
                </div>
            </div>
            <div class="crop-workspace">
                <div class="crop-pane">
                    <canvas id="crop-source-canvas"></canvas>
                    <div id="crop-loading" class="crop-loading">Detecting edges...</div>
                </div>
                <div class="crop-pane">
                    <canvas id="crop-preview-canvas"></canvas>
                </div>
            </div>
            <div class="crop-footer">
                <div class="crop-mode-tools">
                    <div class="btn-group btn-group-sm" role="group" aria-label="Crop mode">
                        <button type="button" class="btn btn-light" data-crop-mode="rectangle" aria-pressed="true">Rectangle</button>
                        <button type="button" class="btn btn-outline-light" data-crop-mode="perspective" aria-pressed="false">Perspective</button>
                    </div>
                </div>
                <div class="crop-detectors" role="group" aria-label="Crop boundary detection">
                    <button type="button" class="btn btn-outline-light" data-crop-detector="hough" aria-pressed="false">Hough</button>
                    <button type="button" class="btn btn-outline-light" data-crop-detector="contour" aria-pressed="false">Contour</button>
                    <button type="button" class="btn btn-outline-light" data-crop-detector="llm" aria-pressed="false">VLM</button>
                </div>
                <div id="perspective-tools" class="crop-detectors" hidden>
                    <button type="button" class="btn btn-outline-light" data-crop-detector="full" aria-pressed="false">Full</button>
                    <label for="crop-background">Background <input id="crop-background" type="color" value="#ffffff"></label>
                    <button id="crop-eyedropper" type="button" class="btn btn-outline-light" aria-label="Pick background color from image" title="Pick background color from image" aria-pressed="false">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.5 3.5"/><path d="m20 3-3.5 3.5"/><path d="M19 2a2.5 2.5 0 0 1 3 3L11 16l-4-4Z"/></svg>
                    </button>
                </div>
                <div id="rectangle-tools" class="rectangle-tools">
                    <button type="button" class="btn btn-outline-light" data-crop-detector="full" aria-pressed="false">Full</button>
                    <label for="crop-output-width">W <input id="crop-output-width" class="form-control form-control-sm" type="number" min="1" value="1"></label>
                    <span>&times;</span>
                    <label for="crop-output-height">H <input id="crop-output-height" class="form-control form-control-sm" type="number" min="1" value="1"></label>
                    <label for="crop-downsampling">
                        <select id="crop-downsampling" class="form-control form-control-sm" aria-label="Downsampling ratio">
                            <option value="">Downsample</option>
                            <option value="0.8" data-ratio data-label="80%">80%</option>
                            <option value="0.75" data-ratio data-label="75%">75%</option>
                            <option value="0.6" data-ratio data-label="60%">60%</option>
                            <option value="0.5" data-ratio data-label="50%">50%</option>
                            <option value="0.33333333333" data-ratio data-label="33%">33%</option>
                            <option value="0.25" data-ratio data-label="25%">25%</option>
                        </select>
                    </label>
                </div>
                <output id="crop-result-size" class="image-dimensions" aria-label="Result size">1x1</output>
                <div id="crop-error" class="crop-error" role="alert"></div>
                <div class="crop-actions">
                    <button id="crop-cancel" type="button" class="btn btn-secondary">Cancel</button>
                    <button id="crop-apply" type="button" class="btn btn-success">Apply Crop</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
