<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ wall_title }}</title>
    <style>
        :root {
            --cell-width: {{ cell_width }}px;
            --cell-height: {{ cell_height }}px;
            color-scheme: light dark;
            font-family: Georgia, 'Times New Roman', serif;
            background: #111;
        }
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: #111;
        }
        body { overflow-x: hidden; }
        .search-panel {
            position: fixed;
            top: 0.75rem;
            right: 0.75rem;
            z-index: 20;
            display: none;
            width: min(22rem, calc(100vw - 1.5rem));
        }
        .search-panel.is-open { display: block; }
        .search-panel input {
            display: block;
            width: 100%;
            height: 2rem;
            padding: 0 0.6rem;
            border: 1px solid rgb(255 255 255 / 28%);
            border-radius: 0.2rem;
            background: #111;
            color: #fff;
            font: 1rem/1.2 Georgia, 'Times New Roman', serif;
        }
        .search-panel input:focus {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }
        .wall {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--cell-width), 1fr));
            grid-auto-rows: var(--cell-height);
            gap: 0;
            width: 100vw;
            min-height: 100vh;
            align-content: start;
            background: #111;
        }
        .tile {
            display: block;
            width: 100%;
            height: 100%;
            padding: 0;
            border: 0;
            background: #111;
            cursor: zoom-in;
            overflow: hidden;
        }
        .tile.double-wide {
            grid-column: span 2;
        }
        .tile.is-hidden { display: none; }
        .tile img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            place-items: center;
            padding: 1vmin;
            border: 0;
            background: rgb(0 0 0 / 92%);
            cursor: zoom-out;
        }
        .lightbox.is-open { display: grid; }
        .lightbox img {
            display: block;
            max-width: 100vw;
            max-height: calc(100vh - 2vmin);
            object-fit: contain;
            box-shadow: 0 1rem 4rem rgb(0 0 0 / 55%);
        }
    </style>
</head>
<body>
    <form class="search-panel" role="search" aria-label="Search image wall">
        <input type="search" aria-label="Search filenames and titles" autocomplete="off" spellcheck="false">
    </form>
    <main class="wall" aria-label="Image wall">
        {% for item in items %}
            <button class="tile{% if item.is_double_wide %} double-wide{% endif %}" type="button">
                <img src="{{ item.src }}" alt="{{ item.alt }}" title="{{ item.title }}" loading="lazy">
            </button>
        {% endfor %}
    </main>
    <button class="lightbox" type="button" aria-label="Close full-size image">
        <img alt="">
    </button>
    <script>
        const searchPanel = document.querySelector('.search-panel');
        const searchInput = searchPanel.querySelector('input');
        const lightbox = document.querySelector('.lightbox');
        const lightboxImage = lightbox.querySelector('img');
        const tiles = Array.from(document.querySelectorAll('.tile'));
        let activeTileIndex = -1;

        const ASCII_EQUIVALENTS = {
            'ß': 'ss',
            'æ': 'ae',
            'œ': 'oe',
            'ð': 'd',
            'þ': 'th',
            'ø': 'o',
            'ł': 'l',
            'đ': 'd',
            'ħ': 'h',
            'ı': 'i',
            'ŋ': 'n',
            '—': '-',
            '–': '-',
            '―': '-',
            '‐': '-',
            '‑': '-',
            '‒': '-',
            '“': '"',
            '”': '"',
            '„': '"',
            '«': '"',
            '»': '"',
            '‘': "'",
            '’': "'",
            '‚': "'",
            '‹': "'",
            '›': "'",
            '…': '...',
            '·': '.',
            '•': '*',
            '©': '(c)',
            '®': '(r)',
            '™': 'tm',
        };

        const normalizeSearchText = (value) => value
            .toLowerCase()
            .replace(/[ßæœðþøłđħıŋ—–―‐‑‒“”„«»‘’‚‹›…·•©®™]/g, (character) => ASCII_EQUIVALENTS[character])
            .normalize('NFKD')
            .replace(/[\u0300-\u036f]/g, '');

        const filterTiles = () => {
            const terms = normalizeSearchText(searchInput.value)
                .trim()
                .split(/\s+/)
                .filter(Boolean);

            tiles.forEach((tile) => {
                const image = tile.querySelector('img');
                const searchText = normalizeSearchText(`${image.alt}\n${image.title}`);
                tile.classList.toggle(
                    'is-hidden',
                    terms.length > 0 && !terms.every((term) => searchText.includes(term)),
                );
            });
        };

        const openSearch = () => {
            searchPanel.classList.add('is-open');
            searchInput.focus();
            searchInput.select();
        };

        const closeSearch = () => {
            searchInput.value = '';
            filterTiles();
            searchPanel.classList.remove('is-open');
            searchInput.blur();
        };

        const openLightbox = (tileIndex) => {
            const image = tiles[tileIndex].querySelector('img');
            activeTileIndex = tileIndex;
            lightboxImage.src = image.currentSrc || image.src;
            lightboxImage.alt = image.alt;
            lightbox.classList.add('is-open');
        };

        const closeLightbox = () => {
            lightbox.classList.remove('is-open');
            lightboxImage.removeAttribute('src');
            activeTileIndex = -1;
        };

        const moveLightbox = (direction) => {
            const visibleTileIndexes = tiles
                .map((tile, index) => ({ tile, index }))
                .filter(({ tile }) => !tile.classList.contains('is-hidden'))
                .map(({ index }) => index);
            const currentIndex = visibleTileIndexes.indexOf(activeTileIndex);
            const nextIndex = (currentIndex + direction + visibleTileIndexes.length) % visibleTileIndexes.length;

            if (visibleTileIndexes.length > 0) {
                openLightbox(visibleTileIndexes[nextIndex]);
            }
        };

        searchPanel.addEventListener('submit', (event) => {
            event.preventDefault();
        });

        searchInput.addEventListener('input', filterTiles);

        document.addEventListener('keydown', (event) => {
            if (lightbox.classList.contains('is-open')) {
                if (event.key === 'Escape') {
                    closeLightbox();
                    return;
                }
                if (event.key === 'ArrowLeft') {
                    moveLightbox(-1);
                    return;
                }
                if (event.key === 'ArrowRight') {
                    moveLightbox(1);
                    return;
                }
            }
            if (event.key === 'Escape') {
                closeSearch();
                return;
            }
            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'f') {
                event.preventDefault();
                openSearch();
            }
        });

        document.querySelectorAll('.tile img').forEach((image, index) => {
            image.addEventListener('click', () => {
                openLightbox(index);
            });
        });

        lightbox.addEventListener('click', () => {
            closeLightbox();
        });
    </script>
</body>
</html>
